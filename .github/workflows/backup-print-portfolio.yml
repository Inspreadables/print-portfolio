# ════════════════════════════════════════════════════════════════════
# Print Portfolio — scheduled git-backed backup
#
# Save this file as: .github/workflows/backup-print-portfolio.yml
# in the repo that hosts the print portfolio.
#
# What it does:
#   Every day at 03:00 UTC (and on manual trigger), it calls the
#   Supabase REST API for the `families` and `pages` tables, saves
#   the results as JSON files, and commits them to the repo if
#   anything changed. This gives you a git history of your portfolio
#   content that survives even if Supabase itself becomes unavailable.
#
# Setup required (one-time):
#   1. In your GitHub repo: Settings → Secrets and variables → Actions
#   2. Add two repository secrets:
#        SUPABASE_URL      = https://YOUR-PROJECT-ID.supabase.co
#        SUPABASE_ANON_KEY = your anon public key
#      (Using the anon key here is fine since RLS now only allows
#      read access to it — this backup job only ever reads.)
# ════════════════════════════════════════════════════════════════════

name: Backup print portfolio data

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch: {}    # allows manual "Run workflow" button too

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure backups folder exists
        run: mkdir -p backups

      - name: Fetch families table
        run: |
          curl -sS "${{ secrets.SUPABASE_URL }}/rest/v1/families?select=*&order=sort_order.asc" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o backups/families.json

      - name: Fetch pages table
        run: |
          curl -sS "${{ secrets.SUPABASE_URL }}/rest/v1/pages?select=*&order=created_at.asc" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o backups/pages.json

      - name: Commit if changed
        run: |
          git config user.name "portfolio-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/families.json backups/pages.json
          if git diff --cached --quiet; then
            echo "No changes to back up."
          else
            git commit -m "Backup: print portfolio data $(date -u +%Y-%m-%d)"
            git push
          fi
